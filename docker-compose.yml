services:
  sandbox-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: gvisor-sandbox-api-sandbox-api:latest
    ports:
      - "8088:8088"
    environment:
      - SANDBOX_API_KEY=${SANDBOX_API_KEY:-change-me}
      - SANDBOX_LOG_LEVEL=${SANDBOX_LOG_LEVEL:-INFO}
      - SANDBOX_PERSISTENT_WORKSPACE_DEFAULT=${SANDBOX_PERSISTENT_WORKSPACE_DEFAULT:-false}
      - SANDBOX_VOLUME_PREFIX=${SANDBOX_VOLUME_PREFIX:-sandbox-session}
      - SANDBOX_WORKER_URL=${SANDBOX_WORKER_URL:-http://sandbox-worker:8081}
      - SANDBOX_WORKER_API_KEY=${SANDBOX_WORKER_API_KEY:-change-me-worker-secret}
      - SANDBOX_WORKER_TIMEOUT_SECONDS=${SANDBOX_WORKER_TIMEOUT_SECONDS:-90}
    depends_on:
      - sandbox-worker
    networks:
      - sandbox-internal
    restart: unless-stopped

  sandbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: gvisor-sandbox-api-sandbox-worker:latest
    environment:
      - SANDBOX_LOG_LEVEL=${SANDBOX_LOG_LEVEL:-INFO}
      - SANDBOX_PERSISTENT_WORKSPACE_DEFAULT=${SANDBOX_PERSISTENT_WORKSPACE_DEFAULT:-false}
      - SANDBOX_VOLUME_PREFIX=${SANDBOX_VOLUME_PREFIX:-sandbox-session}
      - SANDBOX_WORKER_API_KEY=${SANDBOX_WORKER_API_KEY:-change-me-worker-secret}
    expose:
      - "8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox-internal
    restart: unless-stopped

networks:
  sandbox-internal:
    driver: bridge
